<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>文档阅读器</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <!-- MiSans Font -->
  <link href="https://cdn.jsdelivr.net/npm/misans@4.0.0/lib/Normal/MiSans-Regular.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/misans@4.0.0/lib/Normal/MiSans-Medium.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/misans@4.0.0/lib/Normal/MiSans-Semibold.min.css" rel="stylesheet">
  <!-- Cascadia Code Font -->
  <link href="https://cdn.jsdelivr.net/npm/@fontsource/cascadia-code@4.2.1/index.min.css" rel="stylesheet">
  <script src="https://s4.zstatic.net/npm/markdown-it@14.1.0/dist/markdown-it.min.js"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github.min.css"
    id="hljs-light-theme">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css"
    id="hljs-dark-theme" disabled>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
</head>

<body>
  <!-- 主题引导：必须放在 body 起始处（此时 document.body 与 hljs 样式表都已存在），
       否则会在 <head> 中因 document.body 为 null 抛错，导致暗色模式不生效 -->
  <script>
    (function () {
      if (localStorage.getItem('theme') !== 'dark') return;
      document.body.classList.add('dark');
      var light = document.getElementById('hljs-light-theme');
      var dark = document.getElementById('hljs-dark-theme');
      if (light && dark) {
        light.disabled = true;
        dark.disabled = false;
      }
    })();
  </script>
  <button id="mobile-menu-btn" class="mobile-menu-btn" title="目录">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <line x1="3" y1="6" x2="21" y2="6" />
      <line x1="3" y1="12" x2="21" y2="12" />
      <line x1="3" y1="18" x2="21" y2="18" />
    </svg>
  </button>
  <div id="sidebar-overlay" class="sidebar-overlay"></div>
  <aside class="sidebar" id="sidebar">
    <div id="search-container" style="display:none;">
      <input type="text" id="search-input" placeholder="搜索文档...">
    </div>
    <h3 id="sidebar-title">文档目录</h3>
    <ul id="sidebar-list">
      <li>加载中...</li>
    </ul>
    <div class="sidebar-footer">
      <button id="theme-toggle" class="sidebar-btn" title="切换暗/亮模式">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="5" />
          <path
            d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
        </svg>
      </button>
      <button id="sidebar-toggle" class="sidebar-btn" title="收起侧边栏">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M15 18l-6-6 6-6" />
        </svg>
      </button>
    </div>
  </aside>
  <div class="sidebar-collapsed-btns" id="collapsed-btns">
    <button id="search-toggle-collapsed" class="sidebar-btn" title="展开侧边栏并搜索">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="7" />
        <path d="M20 20l-3.5-3.5" />
      </svg>
    </button>
    <button id="theme-toggle-collapsed" class="sidebar-btn" title="切换暗/亮模式">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5" />
        <path
          d="M12 1v2M12 21v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M1 12h2M21 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" />
      </svg>
    </button>
    <button id="sidebar-toggle-collapsed" class="sidebar-btn" title="展开侧边栏">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M9 18l6-6-6-6" />
      </svg>
    </button>
  </div>
  <div class="reading-progress-bar" id="reading-progress"></div>
  <main class="content">
    <div id="viewer">
      <h1>欢迎使用文档阅读器</h1>
      <p>请从左侧目录选择文档进行阅读。</p>
    </div>
  </main>
  <button id="back-to-top" title="返回顶部">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
      <path d="M18 15l-6-6-6 6" />
    </svg>
  </button>
  <script src="app.js"></script>
</body>

</html>
